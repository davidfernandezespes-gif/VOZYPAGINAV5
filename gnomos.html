<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Gnomos contra Babosas</title>
<style>
html,body{margin:0;height:100%;background:#1b2a14;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
canvas{display:block;margin:0 auto;touch-action:none}
#rot{position:fixed;inset:0;display:none;flex-direction:column;gap:18px;align-items:center;justify-content:center;color:#fff;background:#1b2a14;text-align:center;font-size:20px;padding:24px}
#rot button{font-size:16px;padding:10px 18px;border-radius:10px;border:0;background:#ffb300;font-weight:bold}
@media (orientation:portrait){#rot{display:flex}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="rot"><div style="font-size:54px">📱↻</div><div>Gira el móvil en horizontal para jugar</div><button id="rotBtn">Jugar igualmente</button></div>
<script>
"use strict";
const W=960,H=540,GX=130,GY=95,CW=88,CH=88,ROWS=5,COLS=9,RX=GX+COLS*CW;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let scale=1,dpr=1;
function resize(){dpr=Math.min(2,window.devicePixelRatio||1);scale=Math.min(innerWidth/W,innerHeight/H);
 cv.style.width=Math.floor(W*scale)+'px';cv.style.height=Math.floor(H*scale)+'px';
 cv.width=Math.floor(W*scale*dpr);cv.height=Math.floor(H*scale*dpr);
 cv.style.marginTop=Math.max(0,(innerHeight-H*scale)/2)+'px';}
addEventListener('resize',resize);resize();
document.getElementById('rotBtn').onclick=()=>{document.getElementById('rot').remove();if(canFull())goFull();};

/* ---------- Datos ---------- */
const DEF={
 rocio:{name:'Gnomo Rocío',cost:50,cd:7,hp:300,desc:'Produce rocío'},
 tira:{name:'Tirachinas',cost:100,cd:7,hp:300,rate:1.4,dmg:20,desc:'Dispara piedras'},
 muro:{name:'Seta Muro',cost:50,cd:25,hp:4000,desc:'Aguanta mordiscos'},
 mina:{name:'Bellota Mina',cost:25,cd:25,hp:300,arm:12,desc:'Explota al tocarla'},
 petardo:{name:'Petardo',cost:150,cd:40,hp:99999,desc:'Explosión 3×3'},
 escarcha:{name:'Escarcha',cost:175,cd:7,hp:300,rate:1.4,dmg:20,desc:'Dispara y frena'},
 doble:{name:'Doble',cost:200,cd:7,hp:300,rate:1.4,dmg:20,desc:'Dispara doble'},
 trueno:{name:'Trueno',cost:125,cd:35,hp:99999,desc:'Limpia el carril'}
};
const ORDER=['rocio','tira','muro','mina','petardo','escarcha','doble','trueno'];
const EN={
 normal:{name:'Babosa',hp:200,sp:11,dps:100,color:'#9ccc65'},
 rapida:{name:'Rápida',hp:160,sp:22,dps:100,color:'#ffb74d'},
 casco:{name:'Con casco',hp:560,sp:11,dps:100,color:'#aed581',helmet:1},
 saltadora:{name:'Saltadora',hp:340,sp:22,dps:100,color:'#ce93d8'},
 caracol:{name:'Caracol',hp:1000,sp:8,dps:120,color:'#d7ccc8',shell:1},
 jefe:{name:'Reina Babosa',hp:4500,sp:7,dps:400,color:'#7e57c2',big:1}
};
const LEVELS=[
 {unlock:'muro',pool:{normal:1},n:8},
 {unlock:'mina',pool:{normal:3,rapida:1},n:12},
 {unlock:'petardo',pool:{normal:3,rapida:1,casco:1},n:15},
 {unlock:'escarcha',pool:{normal:3,rapida:2,casco:2},n:18},
 {unlock:'doble',pool:{normal:2,rapida:2,casco:2,saltadora:1},n:22},
 {unlock:'trueno',pool:{normal:2,rapida:2,casco:2,saltadora:2,caracol:1},n:26},
 {pool:{normal:2,rapida:2,casco:3,saltadora:2,caracol:1},n:30},
 {pool:{normal:1,rapida:2,casco:3,saltadora:2,caracol:2},n:34},
 {pool:{normal:1,rapida:2,casco:3,saltadora:3,caracol:3},n:38},
 {pool:{normal:1,rapida:2,casco:3,saltadora:3,caracol:3},n:40,boss:1}
];
for(let li=10;li<100;li++){const p=(li-10)/89;LEVELS.push({pool:{normal:Math.max(.5,2-p*1.5),rapida:2,casco:3,saltadora:3,caracol:3+p},n:Math.min(60,Math.round(36+(li-9)*.3)),boss:(li+1)%10===0?Math.floor((li+1)/40)+1:0,hpMul:1+(li-9)*.002});}

/* ---------- Guardado ---------- */
let prog=0,sound=true,chosen=[];
try{prog=Math.min(100,+localStorage.getItem('gcb_prog')||0);sound=localStorage.getItem('gcb_snd')!=='0';}catch(e){}
function save(){try{localStorage.setItem('gcb_prog',prog);localStorage.setItem('gcb_snd',sound?'1':'0')}catch(e){}}
function unlocked(){const u=['rocio','tira'];for(let i=0;i<prog&&i<LEVELS.length;i++)if(LEVELS[i].unlock)u.push(LEVELS[i].unlock);return ORDER.filter(k=>u.includes(k));}

/* ---------- Sonido ---------- */
let AC=null;
function initAudio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();}
function tone(f,d,type,v,f2){if(!sound||!AC)return;try{const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;o.type=type||'sine';o.frequency.setValueAtTime(f,n);if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+d);g.gain.setValueAtTime(v||.15,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(n+d);}catch(e){}}
function noise(d,v){if(!sound||!AC)return;try{const b=AC.createBuffer(1,Math.floor(AC.sampleRate*d),AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*(1-i/a.length);const s=AC.createBufferSource(),g=AC.createGain();s.buffer=b;g.gain.value=v||.3;s.connect(g);g.connect(AC.destination);s.start();}catch(e){}}
let lastShot=0;
const SFX={
 plant:()=>tone(300,.12,'triangle',.2,520),
 shoot:()=>{const n=performance.now();if(n-lastShot>70){lastShot=n;tone(700,.05,'square',.03,400)}},
 dew:()=>{tone(880,.08,'sine',.15);setTimeout(()=>tone(1320,.1,'sine',.12),60)},
 boom:()=>{noise(.5,.4);tone(120,.4,'sawtooth',.15,40)},
 zap:()=>{tone(1500,.35,'sawtooth',.12,100);noise(.25,.2)},
 eat:()=>tone(90,.05,'square',.04),
 wave:()=>tone(220,.5,'sawtooth',.12,330),
 win:()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.25,'triangle',.2),i*130)),
 lose:()=>[392,330,262,196].forEach((f,i)=>setTimeout(()=>tone(f,.3,'triangle',.2),i*180)),
 hog:()=>tone(400,.5,'sawtooth',.1,900),
 no:()=>tone(150,.12,'square',.08),
 click:()=>tone(600,.05,'triangle',.1)
};

/* ---------- Estado ---------- */
let state='menu',G=null,speed=1,anim=0,pointer={x:-1,y:-1},buttons=[];
const rnd=(a,b)=>a+Math.random()*(b-a);
const rowY=r=>GY+r*CH+CH/2;
function pick(pool){let s=0;for(const k in pool)s+=pool[k];let r=Math.random()*s;for(const k in pool){r-=pool[k];if(r<=0)return k}return 'normal'}
function buildQueue(li){
 const L=LEVELS[li],q=[],n=L.n,w1=Math.floor(n*.45),w2=Math.floor(n*.8),burst=Math.ceil(n*.15);let t=20;
 for(let i=0;i<n;i++){
  let wave=0;
  if(i===w1||i===w2){t+=8;wave=i===w1?1:2}
  q.push({k:pick(L.pool),t,wave});
  const inBurst=(i>=w1&&i<w1+burst)||i>=w2;
  t+=inBurst?1.3:Math.max(li>9?3:3.2,9-li*.45-i*.1);
 }
 for(let b=0;b<(L.boss||0);b++)q.push({k:'jefe',t:t+6+b*8,wave:0});
 return q;
}
function startLevel(li){
 G={li,hpMul:LEVELS[li].hpMul||1,dew:li>=10?300:150,t:0,defs:[],ens:[],proj:[],dews:[],fx:[],
  hogs:[0,1,2,3,4].map(r=>({r,s:0,x:GX-55})),
  cards:chosen.map(k=>({k,cd:DEF[k].cd>20?DEF[k].cd*.5:0})),
  sel:null,shovel:false,queue:buildQueue(li),spawned:0,skyT:5,endT:-1,
  grid:[...Array(ROWS)].map(()=>Array(COLS).fill(null)),
  banner:{text:li===0?'Toca las gotas de rocío para recogerlas':'¡Nivel '+(li+1)+'!',sub:li===0?'Luego elige un gnomo arriba y tócale un sitio en el césped':'',t:5}};
 state='play';speed=1;
}
function spawnEnemy(k){const E=EN[k];const hp=Math.round(E.hp*G.hpMul);G.ens.push({k,r:Math.floor(Math.random()*ROWS),x:RX+30,hp,max:hp,slow:0,hit:0,jumped:false,jump:0,eating:false,ph:Math.random()*6,eatT:0});}

/* ---------- Lógica ---------- */
function damage(e,v){if(e.dead)return;e.hp-=v;e.hit=.1;if(e.hp<=0){e.dead=true;G.fx.push({type:'poof',x:e.x,y:rowY(e.r)+10,t:.5,m:.5});}}
function explode(r1,r2,x1,x2,cx,cy){
 for(const e of G.ens)if(!e.dead&&e.r>=r1&&e.r<=r2&&e.x>=x1&&e.x<=x2)damage(e,1800);
 G.fx.push({type:'boom',x:cx,y:cy,t:.6,m:.6,R:(x2-x1)/2});SFX.boom();
}
function enemyAhead(r,x){return G.ens.some(e=>!e.dead&&e.r===r&&e.x>x-10&&e.x<RX+20);}
function fire(d,cx,cy){G.proj.push({r:d.r,x:cx+22,y:cy-12,dmg:DEF[d.k].dmg,slow:d.k==='escarcha'});SFX.shoot();}
function blocker(e){
 const front=e.x-(EN[e.k].big?40:22);
 for(const d of G.defs){
  if(d.r!==e.r||d.hp<=0||d.k==='petardo'||d.k==='trueno'||(d.k==='mina'&&d.armed))continue;
  const l=GX+d.c*CW+12,rgt=GX+(d.c+1)*CW-12;
  if(front<rgt&&e.x>l)return d;
 }
 return null;
}
function update(dt){
 const g=G;g.t+=dt;
 while(g.spawned<g.queue.length&&g.queue[g.spawned].t<=g.t){
  const q=g.queue[g.spawned++];
  if(q.wave){g.banner={text:q.wave===2?'¡Oleada final!':'¡Se acerca una gran oleada!',sub:'',t:3};SFX.wave();}
  if(q.k==='jefe'){g.banner={text:'¡Llega la Reina Babosa!',sub:'',t:3};SFX.wave();}
  spawnEnemy(q.k);
 }
 g.skyT-=dt;
 if(g.skyT<=0){g.skyT=rnd(9,12);g.dews.push({x:rnd(GX+40,RX-40),y:GY-20,ty:rnd(GY+60,GY+ROWS*CH-40),v:25,life:10});}
 for(const d of g.dews){
  if(d.collect){d.x+=(40-d.x)*Math.min(1,dt*7);d.y+=(40-d.y)*Math.min(1,dt*7);d.ct-=dt;if(d.ct<=0)d.dead=true;}
  else if(d.y<d.ty)d.y=Math.min(d.ty,d.y+55*dt);
  else{d.life-=dt;if(d.life<=0)d.dead=true;}
 }
 g.dews=g.dews.filter(d=>!d.dead);
 for(const c of g.cards)c.cd=Math.max(0,c.cd-dt);
 // defensores
 for(const d of g.defs){
  const D=DEF[d.k],cx=GX+d.c*CW+CW/2,cy=rowY(d.r);
  if(d.k==='rocio'){d.tm-=dt;if(d.tm<=0){d.tm=12;g.dews.push({x:cx+rnd(-15,15),y:cy-15,ty:cy+18,v:25,life:10});}}
  else if(D.rate){
   d.tm-=dt;
   if(d.tm<=0&&enemyAhead(d.r,cx)){d.tm=D.rate;fire(d,cx,cy);if(d.k==='doble')d.extra=.18;}
   if(d.extra>0){d.extra-=dt;if(d.extra<=0)fire(d,cx,cy);}
  }
  else if(d.k==='mina'){
   if(!d.armed){d.tm-=dt;if(d.tm<=0){d.armed=true;SFX.click();}}
   else if(g.ens.some(e=>!e.dead&&e.r===d.r&&Math.abs(e.x-cx)<CW*.55)){explode(d.r,d.r,cx-CW*.75,cx+CW*.75,cx,cy);d.hp=0;}
  }
  else if(d.k==='petardo'){d.tm-=dt;if(d.tm<=0){explode(d.r-1,d.r+1,cx-CW*1.5,cx+CW*1.5,cx,cy);d.hp=0;}}
  else if(d.k==='trueno'){d.tm-=dt;if(d.tm<=0){for(const e of g.ens)if(!e.dead&&e.r===d.r&&e.x<RX+40)damage(e,1800);g.fx.push({type:'zap',x:cx,y:cy,r:d.r,t:.5,m:.5});SFX.zap();d.hp=0;}}
 }
 // proyectiles
 for(const p of g.proj){
  p.x+=420*dt;let best=null;
  for(const e of g.ens)if(!e.dead&&e.r===p.r&&Math.abs(e.x-p.x)<22&&(!best||e.x<best.x))best=e;
  if(best){damage(best,p.dmg);if(p.slow)best.slow=4;p.dead=true;g.fx.push({type:'spark',x:p.x,y:p.y,t:.2,m:.2,ice:p.slow});}
  if(p.x>W+20)p.dead=true;
 }
 g.proj=g.proj.filter(p=>!p.dead);
 // enemigos
 for(const e of g.ens){
  if(e.dead)continue;const E=EN[e.k];
  e.hit=Math.max(0,e.hit-dt);e.slow=Math.max(0,e.slow-dt);const f=e.slow>0?.5:1;
  if(e.jump>0){e.jump-=dt;e.x-=CW*1.2/.6*dt;}
  else{
   const t=blocker(e);
   if(t){
    if(e.k==='saltadora'&&!e.jumped){e.jumped=true;e.jump=.6;e.eating=false;}
    else{e.eating=true;t.hp-=E.dps*f*dt;e.eatT-=dt;if(e.eatT<=0){e.eatT=.5;SFX.eat();}}
   }else{e.eating=false;const sp=(e.k==='saltadora'&&e.jumped)?11:E.sp;e.x-=sp*f*dt;}
  }
  if(e.x<GX-10){const h=g.hogs[e.r];if(h.s===0){h.s=1;SFX.hog();}else if(h.s===2&&e.x<GX-70){lose();return;}}
 }
 for(const h of g.hogs){
  if(h.s!==1)continue;h.x+=350*dt;
  for(const e of g.ens)if(!e.dead&&e.r===h.r&&e.x<h.x+30&&e.x>h.x-80)damage(e,99999);
  if(h.x>W+50)h.s=2;
 }
 g.ens=g.ens.filter(e=>!e.dead);
 g.defs=g.defs.filter(d=>{if(d.hp<=0){if(g.grid[d.r][d.c]===d)g.grid[d.r][d.c]=null;return false}return true});
 for(const fx of g.fx)fx.t-=dt;g.fx=g.fx.filter(fx=>fx.t>0);
 if(g.banner){g.banner.t-=dt;if(g.banner.t<=0)g.banner=null;}
 if(g.spawned>=g.queue.length&&g.ens.length===0){if(g.endT<0)g.endT=1.5;g.endT-=dt;if(g.endT<=0)win();}
}
function win(){
 state='win';SFX.win();
 G.newUnlock=null;
 if(G.li===prog){prog=Math.min(LEVELS.length,prog+1);G.newUnlock=LEVELS[G.li].unlock||null;save();}
}
function lose(){state='lose';SFX.lose();}

/* ---------- Pantalla completa ---------- */
let pendingFull=true;
const isFull=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
const canFull=()=>!!(document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen);
function goFull(){const d=document.documentElement;try{const p=(d.requestFullscreen||d.webkitRequestFullscreen).call(d,{navigationUI:'hide'});const lock=()=>{try{screen.orientation.lock('landscape').catch(()=>{})}catch(e){}};if(p&&p.then)p.then(lock).catch(()=>{});else lock();}catch(e){}}
function exitFull(){try{(document.exitFullscreen||document.webkitExitFullscreen).call(document)}catch(e){}}
function fullBtn(x,y){if(canFull())button(x,y,64,56,isFull()?'🗗':'⛶',()=>{pendingFull=!isFull();},'#5d4037');}
document.addEventListener('fullscreenchange',resize);document.addEventListener('webkitfullscreenchange',resize);
/* ---------- Entrada ---------- */
function toLocal(ev){const r=cv.getBoundingClientRect();return{x:(ev.clientX-r.left)/r.width*W,y:(ev.clientY-r.top)/r.height*H};}
cv.addEventListener('pointerdown',ev=>{ev.preventDefault();initAudio();const p=toLocal(ev);pointer=p;onTap(p.x,p.y);});
cv.addEventListener('pointerup',()=>{initAudio();if(pendingFull!==null){const f=pendingFull;pendingFull=null;if(f&&!isFull())goFull();else if(!f&&isFull())exitFull();}});
cv.addEventListener('pointermove',ev=>{pointer=toLocal(ev);});
cv.addEventListener('contextmenu',ev=>ev.preventDefault());
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')state='pause';});
addEventListener('keydown',ev=>{if((ev.key==='Escape'||ev.key===' ')&&(state==='play'||state==='pause')){state=state==='play'?'pause':'play';}});
function onTap(x,y){
 if(state==='play'){
  for(let i=G.dews.length-1;i>=0;i--){const d=G.dews[i];if(!d.collect&&Math.hypot(d.x-x,d.y-y)<36){d.collect=true;d.ct=.45;G.dew+=d.v;SFX.dew();return;}}
 }
 for(let i=buttons.length-1;i>=0;i--){const b=buttons[i];if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){b.fn();return;}}
 if(state==='play')gridTap(x,y);
}
function gridTap(x,y){
 const c=Math.floor((x-GX)/CW),r=Math.floor((y-GY)/CH);
 if(c<0||c>=COLS||r<0||r>=ROWS){G.sel=null;G.shovel=false;return;}
 if(G.shovel){const d=G.grid[r][c];if(d){d.hp=0;G.grid[r][c]=null;G.fx.push({type:'poof',x:GX+c*CW+CW/2,y:rowY(r)+10,t:.4,m:.4});SFX.plant();}G.shovel=false;return;}
 if(G.sel===null)return;
 const card=G.cards[G.sel],D=DEF[card.k];
 if(G.grid[r][c]){SFX.no();return;}
 if(G.dew<D.cost||card.cd>0){SFX.no();G.sel=null;return;}
 G.dew-=D.cost;card.cd=D.cd;
 const d={k:card.k,r,c,hp:D.hp,max:D.hp,ph:Math.random()*6,
  tm:card.k==='rocio'?6:card.k==='mina'?D.arm:card.k==='petardo'?1:card.k==='trueno'?.6:.4};
 G.defs.push(d);G.grid[r][c]=d;G.sel=null;
 G.fx.push({type:'dust',x:GX+c*CW+CW/2,y:rowY(r)+30,t:.4,m:.4});SFX.plant();
}

/* ---------- Dibujo: utilidades ---------- */
function circ(x,y,r,f,s,lw){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);if(f){ctx.fillStyle=f;ctx.fill()}if(s){ctx.strokeStyle=s;ctx.lineWidth=lw||2;ctx.stroke()}}
function ell(x,y,rx,ry,f){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fillStyle=f;ctx.fill()}
function rr(x,y,w,h,r,f,s,lw){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h);if(f){ctx.fillStyle=f;ctx.fill()}if(s){ctx.strokeStyle=s;ctx.lineWidth=lw||2;ctx.stroke()}}
function txt(s,x,y,size,color,align,outline){ctx.font='bold '+size+'px system-ui,-apple-system,Segoe UI,Roboto,sans-serif';ctx.textAlign=align||'center';ctx.textBaseline='middle';if(outline!==false){ctx.lineJoin='round';ctx.lineWidth=Math.max(2,size/5);ctx.strokeStyle='rgba(0,0,0,.65)';ctx.strokeText(s,x,y);}ctx.fillStyle=color||'#fff';ctx.fillText(s,x,y);}
function button(x,y,w,h,label,fn,color,enabled){enabled=enabled!==false;rr(x,y+4,w,h,12,'rgba(0,0,0,.35)');rr(x,y,w,h,12,enabled?(color||'#ffb300'):'#777','rgba(0,0,0,.4)',2);txt(label,x+w/2,y+h/2,Math.min(26,h*.42),'#fff');if(enabled)buttons.push({x,y,w,h,fn:()=>{SFX.click();fn();}});}
function drawDew(x,y,s,a){ctx.save();ctx.globalAlpha=a==null?1:a;ctx.translate(x,y);ctx.scale(s,s);ctx.beginPath();ctx.moveTo(0,-15);ctx.bezierCurveTo(12,-2,13,10,0,11);ctx.bezierCurveTo(-13,10,-12,-2,0,-15);ctx.fillStyle='#4fc3f7';ctx.fill();ctx.strokeStyle='#01579b';ctx.lineWidth=2;ctx.stroke();circ(-4,2,3,'rgba(255,255,255,.85)');ctx.restore();}
function slingshot(x,y,stone){ctx.strokeStyle='#6d4c41';ctx.lineWidth=3;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x,y+12);ctx.lineTo(x,y);ctx.lineTo(x-5,y-10);ctx.moveTo(x,y);ctx.lineTo(x+5,y-10);ctx.stroke();ctx.strokeStyle='#eee';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(x-5,y-10);ctx.lineTo(x+5,y-10);ctx.stroke();if(stone)circ(x,y-10,3,stone);}

/* ---------- Dibujo: personajes ---------- */
function drawDefender(k,x,y,s,t,o){
 o=o||{};ctx.save();ctx.translate(x,y);ctx.scale(s,s);
 ell(0,30,26,7,'rgba(0,0,0,.25)');
 const bob=Math.sin(t*3+(o.ph||0))*1.5,hpf=o.hpf==null?1:o.hpf;
 if(k==='muro'){
  rr(-15,-2,30,32,8,'#fff3e0','#bcaaa4',2);
  ctx.beginPath();ctx.ellipse(0,-2,36,30,0,Math.PI,0);ctx.closePath();

  txt(D.desc,x+88,y+118,13,'#4e342e','center',false);
  if(on)txt('✓',x+158,y+16,20,'#43a047');
  buttons.push({x,y,w:176,h:138,fn:()=>{if(on)chosen=chosen.filter(c=>c!==k);else if(chosen.length<6)chosen.push(k);else{SFX.no();return;}SFX.click();}});
 });
 txt(chosen.length+'/6',W/2,H-50,22,'#fff');
 button(40,H-82,180,62,'Volver',()=>{state='menu';menuPage=-1;},'#6d4c41');
 button(W-260,H-82,220,62,'¡A jugar!',()=>{chosen=ORDER.filter(k=>chosen.includes(k));startLevel(selLevel);},'#43a047',chosen.length>0);
}

/* ---------- Bucle ---------- */
let last=performance.now();
function loop(now){
 const dt=Math.min(.05,(now-last)/1000);last=now;anim+=dt;
 if(state==='play')for(let i=0;i<speed&&state==='play';i++)update(dt);
 ctx.setTransform(scale*dpr,0,0,scale*dpr,0,0);
 buttons=[];
 if(state==='menu')drawMenu();
 else if(state==='select')drawSelect();
 else{drawGame();if(state==='pause')drawPause();else if(state==='win')drawWin();else if(state==='lose')drawLose();}
 requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
