<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sonido para dormir y concentrarse</title>
<style>
:root{--bg:#0b0d14;--card:#151923;--txt:#e6e8ef;--mut:#8a90a2;--acc:#7aa2ff;--line:#262c3b;--btn:#1d2332}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);min-height:100vh;transition:background .4s}
main{max-width:460px;margin:0 auto;padding:12px 0 40px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:4px 0 8px}
h1{font-size:20px;margin:0;font-weight:600}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:22px 0 8px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;color:var(--txt);background:var(--btn);border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer;min-height:44px}
button[aria-pressed="true"],button.on{background:var(--acc);color:#0b0d14;border-color:var(--acc)}
#play{width:100%;min-height:64px;font-size:18px;font-weight:600;margin-top:20px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:12px 0}
.row label,.lbl{color:var(--mut);font-size:14px}
input[type=range]{width:100%;accent-color:var(--acc)}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--acc)}
input[type=number]{width:90px;min-height:44px;background:var(--btn);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:8px;font:inherit}
.big{font-size:44px;font-variant-numeric:tabular-nums;text-align:center;margin:6px 0 2px;font-weight:300}
.mut{color:var(--mut);font-size:14px;text-align:center;margin:6px 0}
.hidden{display:none}
.custom{display:flex;gap:8px;align-items:center;margin-top:12px}
.custom span{color:var(--mut);font-size:14px}
body.night{--bg:#000;--card:#07080c;--txt:#6d7385;--mut:#3d4252;--acc:#3f4f78;--line:#12151d;--btn:#0c0e14}
body.night::after{content:"";position:fixed;inset:0;background:#000;opacity:.4;pointer-events:none}
</style>
</head>
<body>
<main>
  <header>
    <h1>Sonido para dormir</h1>
    <button id="nightBtn" aria-pressed="false">Modo noche</button>
  </header>

  <h2>Ruido</h2>
  <div class="card">
    <div class="chips" id="noiseChips">
      <button data-noise="none" aria-pressed="false">Ninguno</button>
      <button data-noise="white" aria-pressed="false">Blanco</button>
      <button data-noise="pink" aria-pressed="false">Rosa</button>
      <button data-noise="brown" aria-pressed="true">Marrón</button>
    </div>
  </div>

  <h2>Tono</h2>
  <div class="card">
    <div class="row">
      <label for="toneOn">Activar tono</label>
      <input type="checkbox" id="toneOn">
    </div>
    <div class="chips" id="freqChips">
      <button data-f="40" aria-pressed="false">40 Hz</button>
      <button data-f="96" aria-pressed="false">96 Hz</button>
      <button data-f="174" aria-pressed="false">174 Hz</button>
      <button data-f="285" aria-pressed="false">285 Hz</button>
      <button data-f="432" aria-pressed="false">432 Hz</button>
      <button data-f="528" aria-pressed="false">528 Hz</button>
    </div>
    <div class="row" style="margin-top:14px">
      <span class="lbl">Frecuencia</span><span class="lbl" id="freqVal">40 Hz</span>
    </div>
    <input type="range" id="freq" min="20" max="600" step="1" value="40">
    <div class="row">
      <label for="bin">Pulsos binaurales (usa auriculares)</label>
      <input type="checkbox" id="bin">
    </div>
    <div id="beatRow" class="hidden">
      <div class="row">
        <span class="lbl">Diferencia entre oídos</span><span class="lbl" id="beatVal">4 Hz</span>
      </div>
      <input type="range" id="beat" min="1" max="30" step="1" value="4">
    </div>
  </div>

  <h2>Volumen</h2>
  <div class="card">
    <div class="lbl">Ruido</div>
    <input type="range" id="nv" min="0" max="1" step="0.01" value="0.5">
    <div class="lbl" style="margin-top:12px">Tono</div>
    <input type="range" id="tv" min="0" max="1" step="0.01" value="0.5">
  </div>

  <button id="play">Reproducir</button>
  <div class="big" id="count">--:--</div>
  <div class="mut" id="status">Parado</div>

  <h2>Temporizador</h2>
  <div class="card">
    <div class="chips" id="timerChips">
      <button data-min="15">15 min</button>
      <button data-min="30">30 min</button>
      <button data-min="45">45 min</button>
      <button data-min="60">60 min</button>
    </div>
    <div class="custom">
      <input type="number" id="customMin" min="1" max="600" placeholder="min">
      <button id="customBtn">Iniciar</button>
    </div>
    <div class="mut">Al terminar, el sonido baja poco a poco y se detiene.</div>
    <button id="cancelTimer" style="width:100%;margin-top:10px">Cancelar temporizador</button>
  </div>
</main>

<script>
const $ = s => document.querySelector(s);
let ctx = null, master = null, noiseGain = null, toneGain = null;
let playing = false, noiseType = 'brown', noiseSrc = null, toneNodes = [];
let bufCache = {}, timerEnd = 0, timerIv = null, stopTimeout = null, wake = null;

function ensureCtx() {
  if (!ctx) {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain();
    master.gain.value = 0;
    master.connect(ctx.destination);
    noiseGain = ctx.createGain();
    noiseGain.connect(master);
    toneGain = ctx.createGain();
    toneGain.connect(master);
  }
  return ctx;
}

function makeBuffer(type) {
  if (bufCache[type]) return bufCache[type];
  const sr = ctx.sampleRate, len = sr * 20, fade = Math.floor(sr * 0.1);
  const buf = ctx.createBuffer(2, len, sr);
  for (let ch = 0; ch < 2; ch++) {
    const d = buf.getChannelData(ch);
    let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0, last = 0;
    for (let i = 0; i < len; i++) {
      const w = Math.random() * 2 - 1;
      if (type === 'white') {
        d[i] = w * 0.5;
      } else if (type === 'pink') {
        b0 = 0.99886 * b0 + w * 0.0555179;
        b1 = 0.99332 * b1 + w * 0.0750759;
        b2 = 0.96900 * b2 + w * 0.1538520;
        b3 = 0.86650 * b3 + w * 0.3104856;
        b4 = 0.55000 * b4 + w * 0.5329522;
        b5 = -0.7616 * b5 - w * 0.0168980;
        d[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * 0.5362) * 0.11;
        b6 = w * 0.115926;
      } else {
        last = (last + 0.02 * w) / 1.02;
        d[i] = last * 1.75;
      }
    }
    // Suaviza los bordes para que el bucle no haga clic
    for (let i = 0; i < fade; i++) {
      const g = i / fade;
      d[i] *= g;
      d[len - 1 - i] *= g;
    }
  }
  bufCache[type] = buf;
  return buf;
}

function stopNoiseSrc() {
  if (noiseSrc) {
    try { noiseSrc.stop(); } catch (e) {}
    noiseSrc.disconnect();
    noiseSrc = null;
  }
}

function startNoise() {
  stopNoiseSrc();
  if (!playing || noiseType === 'none') return;
  const src = ctx.createBufferSource();
  src.buffer = makeBuffer(noiseType);
  src.loop = true;
  src.connect(noiseGain);
  src.start();
  noiseSrc = src;
}

function stopTone() {
  toneNodes.forEach(n => {
    if (n.stop) { try { n.stop(); } catch (e) {} }
    n.disconnect();
  });
  toneNodes = [];
}

function startTone() {
  stopTone();
  if (!playing || !$('#toneOn').checked) return;
  const f = +$('#freq').value, beat = +$('#beat').value, bin = $('#bin').checked;
  if (!bin) {
    const o = ctx.createOscillator();
    o.type = 'sine';
    o.frequency.value = f;
    o.connect(toneGain);
    o.start();
    toneNodes.push(o);
  } else {
    [[f, -1], [f + beat, 1]].forEach(([freq, pan]) => {
      const o = ctx.createOscillator();
      o.type = 'sine';
      o.frequency.value = freq;
      const p = ctx.createStereoPanner();
      p.pan.value = pan;
      o.connect(p);
      p.connect(toneGain);
      o.start();
      toneNodes.push(o, p);
    });
  }
}

function applyVolumes() {
  if (!ctx) return;
  noiseGain.gain.value = +$('#nv').value;
  toneGain.gain.value = +$('#tv').value * 0.6;
}

function status(msg) { $('#status').textContent = msg; }

function play() {
  ensureCtx();
  ctx.resume();
  clearTimeout(stopTimeout);
  playing = true;
  const now = ctx.currentTime;
  master.gain.cancelScheduledValues(now);
  master.gain.setValueAtTime(0, now);
  master.gain.linearRampToValueAtTime(1, now + 3);
  applyVolumes();
  startNoise();
  startTone();
  $('#play').textContent = 'Detener';
  $('#play').classList.add('on');
  status('Sonando');
  try {
    if (navigator.wakeLock) {
      navigator.wakeLock.request('screen').then(l => { wake = l; }).catch(() => {});
    }
  } catch (e) {}
}

function stop(fadeSec = 0.8) {
  if (!playing) return;
  playing = false;
  const now = ctx.currentTime;
  master.gain.cancelScheduledValues(now);
  master.gain.setValueAtTime(master.gain.value, now);
  master.gain.linearRampToValueAtTime(0, now + fadeSec);
  clearTimeout(stopTimeout);
  stopTimeout = setTimeout(() => { stopNoiseSrc(); stopTone(); }, fadeSec * 1000 + 50);
  $('#play').textContent = 'Reproducir';
  $('#play').classList.remove('on');
  try { if (wake) { wake.release(); wake = null; } } catch (e) {}
}

function cancelTimer() {
  clearInterval(timerIv);
  timerIv = null;
  timerEnd = 0;
  $('#count').textContent = '--:--';
}

function tick() {
  const left = timerEnd - Date.now();
  if (left <= 0) {
    clearInterval(timerIv);
    timerIv = null;
    timerEnd = 0;
    $('#count').textContent = '00:00';
    stop(10);
    status('Temporizador terminado');
    return;
  }
  const s = Math.ceil(left / 1000);
  const m = Math.floor(s / 60), r = s % 60;
  $('#count').textContent = String(m).padStart(2, '0') + ':' + String(r).padStart(2, '0');
}

function startTimer(min) {
  if (!min || min <= 0) return;
  timerEnd = Date.now() + min * 60000;
  clearInterval(timerIv);
  timerIv = setInterval(tick, 1000);
  tick();
  if (!playing) play();
  status('Temporizador: ' + min + ' min');
}

function setPressed(container, el) {
  container.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b === el ? 'true' : 'false'));
}

// Ruido
$('#noiseChips').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  noiseType = b.dataset.noise;
  setPressed($('#noiseChips'), b);
  if (playing) startNoise();
});

// Tono
$('#toneOn').addEventListener('change', () => { if (playing) startTone(); });

$('#freq').addEventListener('input', e => {
  $('#freqVal').textContent = e.target.value + ' Hz';
  document.querySelectorAll('#freqChips button').forEach(b => b.setAttribute('aria-pressed', b.dataset.f === e.target.value ? 'true' : 'false'));
});
$('#freq').addEventListener('change', () => { if (playing) startTone(); });

$('#freqChips').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  $('#freq').value = b.dataset.f;
  $('#freqVal').textContent = b.dataset.f + ' Hz';
  setPressed($('#freqChips'), b);
  if (playing) startTone();
});

$('#bin').addEventListener('change', e => {
  $('#beatRow').classList.toggle('hidden', !e.target.checked);
  if (playing) startTone();
});
$('#beat').addEventListener('input', e => { $('#beatVal').textContent = e.target.value + ' Hz'; });
$('#beat').addEventListener('change', () => { if (playing) startTone(); });

// Volumen
$('#nv').addEventListener('input', applyVolumes);
$('#tv').addEventListener('input', applyVolumes);

// Reproducir / detener
$('#play').addEventListener('click', () => {
  if (playing) {
    cancelTimer();
    stop(0.8);
    status('Parado');
  } else {
    play();
  }
});

// Temporizador
$('#timerChips').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  startTimer(+b.dataset.min);
});
$('#customBtn').addEventListener('click', () => {
  const v = Math.min(600, Math.max(1, Math.floor(+$('#customMin').value)));
  if (v > 0 && !isNaN(v)) startTimer(v);
});
$('#cancelTimer').addEventListener('click', () => {
  cancelTimer();
  status(playing ? 'Sonando' : 'Parado');
});

// Modo noche
$('#nightBtn').addEventListener('click', () => {
  const on = document.body.classList.toggle('night');
  $('#nightBtn').setAttribute('aria-pressed', on ? 'true' : 'false');
});
</script>

<!-- botón para volver al menú de apps (añadido) -->
<a href="./#apps" id="vpHome" aria-label="Volver al menú de apps" style="position:fixed;left:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:2147483647;width:44px;height:44px;border-radius:50%;background:#7b5a3cE6;color:#fff;display:flex;align-items:center;justify-content:center;text-decoration:none;font:600 20px/1 system-ui,sans-serif;box-shadow:0 2px 10px #0006">⌂</a>
</body>
</html>
