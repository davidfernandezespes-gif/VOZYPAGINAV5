<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2b2340">
<title>Tres en raya</title>
<style>
:root{--bg:#2b2340;--card:#3a3056;--ink:#f3eefc;--mut:#b7add0;--x:#ff7a59;--o:#4fc3f7;--gold:#ffd54f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 20%,#3d3160,var(--bg));color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;user-select:none;-webkit-user-select:none}
main{max-width:460px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
h1{margin:0;text-align:center;font-size:26px}
.seg{display:flex;background:var(--card);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;border-radius:10px;padding:11px 4px;font:600 15px system-ui,sans-serif;background:none;color:var(--mut)}
.seg button.on{background:var(--ink);color:var(--bg)}
.score{display:flex;gap:8px}
.score div{flex:1;background:var(--card);border-radius:14px;padding:8px;text-align:center;border:3px solid transparent;transition:border-color .2s}
.score div.turn{border-color:var(--gold)}
.score b{display:block;font-size:28px}
.score small{color:var(--mut);font-size:13px}
#status{text-align:center;font-size:20px;font-weight:700;min-height:28px}
#board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;aspect-ratio:1;width:100%}
.cell{border:0;border-radius:18px;background:var(--card);font:800 min(22vw,100px)/1 system-ui,sans-serif;display:grid;place-items:center;color:var(--ink);transition:background .2s,opacity .25s,transform .15s;padding:0}
.cell:active{transform:scale(.96)}
.cell.X{color:var(--x)}.cell.O{color:var(--o)}
.cell.win{background:var(--gold);color:var(--bg);animation:pop .5s}
.cell.old{opacity:.35}
@keyframes pop{50%{transform:scale(1.08)}}
.row{display:flex;gap:10px}
.btn{flex:1;border:0;border-radius:14px;padding:14px;font:700 16px system-ui,sans-serif;background:var(--gold);color:#2b2340}
.btn.alt{background:var(--card);color:var(--ink)}
.switch{display:flex;justify-content:space-between;align-items:center;background:var(--card);border-radius:14px;padding:12px 14px;font-size:16px}
.switch small{display:block;color:var(--mut);font-size:13px;margin-top:2px}
.switch input{width:26px;height:26px;accent-color:var(--gold)}
.lbl{color:var(--mut);font-size:13px;text-transform:uppercase;letter-spacing:.06em;margin:4px 2px -4px}
#home{position:absolute;left:14px;top:calc(10px + env(safe-area-inset-top));width:44px;height:44px;border-radius:50%;background:#fbf5e8;color:#3b2a1a;display:grid;place-items:center;font-size:22px;text-decoration:none;box-shadow:0 4px 12px rgba(0,0,0,.4);z-index:10}
</style>
</head>
<body>
<main>
  <h1>Tres en raya</h1>
  <div class="seg" id="modeSeg"><button data-m="cpu">Contra el móvil</button><button data-m="pvp">Dos personas</button></div>
  <div id="levelBox"><div class="lbl">Dificultad</div>
    <div class="seg" id="levelSeg" style="margin-top:8px"><button data-l="facil">Fácil</button><button data-l="medio">Medio</button><button data-l="imposible">Imposible</button></div>
  </div>
  <label class="switch"><span>Modo infinito<small>Solo 3 fichas cada uno: la más antigua desaparece. Sin empates.</small></span><input type="checkbox" id="infinite"></label>
  <div class="score"><div id="sX"><b id="pX">0</b><small id="nX">Tú (X)</small></div><div><b id="pD">0</b><small>Empates</small></div><div id="sO"><b id="pO">0</b><small id="nO">Móvil (O)</small></div></div>
  <div id="status"></div>
  <div id="board"></div>
  <div class="row"><button class="btn" id="newRound">Nueva ronda</button><button class="btn alt" id="resetScore">Reiniciar marcador</button></div>
</main>
<a id="home" href="./" aria-label="Volver al menú de apps">⌂</a>
<script>
'use strict';
const $ = id => document.getElementById(id);
const LINES = [[0, 1, 2], [3, 4, 5], [6, 7, 8], [0, 3, 6], [1, 4, 7], [2, 5, 8], [0, 4, 8], [2, 4, 6]];
const KEY = 'tresenraya-v1';
let tablero, turnoActual, juegoActivo, bloqueoCPU = false, colas, abre = 'X', cpuTimer = null;
const cfg = Object.assign({ modo: 'cpu', nivel: 'medio', infinito: false, marcador: { X: 0, O: 0, empates: 0 } }, (() => { try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { return {}; } })());
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(cfg)); } catch (e) {} };
const CPU = 'O', HUM = 'X';

const cells = [];
for (let i = 0; i < 9; i++) { const b = document.createElement('button'); b.className = 'cell'; b.setAttribute('aria-label', 'Casilla ' + (i + 1)); b.onclick = () => jugarHumano(i); $('board').appendChild(b); cells.push(b); }

function ganador(t) { for (const l of LINES) { const [a, b, c] = l; if (t[a] && t[a] === t[b] && t[a] === t[c]) return { s: t[a], l }; } return null; }
const libres = t => t.map((v, i) => v ? -1 : i).filter(i => i >= 0);

function nuevaRonda() {
  clearTimeout(cpuTimer); bloqueoCPU = false;
  tablero = Array(9).fill(null); colas = { X: [], O: [] };
  turnoActual = abre; abre = abre === 'X' ? 'O' : 'X'; // quien abre se va alternando
  juegoActivo = true;
  pintar(); estado();
  turnoCPU();
}
function pintar(win) {
  cells.forEach((b, i) => {
    b.textContent = tablero[i] || '';
    b.className = 'cell' + (tablero[i] ? ' ' + tablero[i] : '') + (win && win.includes(i) ? ' win' : '');
  });
  // modo infinito: la ficha que va a desaparecer en el próximo turno de su dueño se ve atenuada
  if (cfg.infinito && juegoActivo) { const q = colas[turnoActual]; if (q.length === 3) cells[q[0]].classList.add('old'); }
  $('pX').textContent = cfg.marcador.X; $('pO').textContent = cfg.marcador.O; $('pD').textContent = cfg.marcador.empates;
  const vsCpu = cfg.modo === 'cpu';
  $('nX').textContent = vsCpu ? 'Tú (X)' : 'Jugador X'; $('nO').textContent = vsCpu ? 'Móvil (O)' : 'Jugador O';
  $('sX').classList.toggle('turn', juegoActivo && turnoActual === 'X'); $('sO').classList.toggle('turn', juegoActivo && turnoActual === 'O');
}
function estado(msg) {
  if (msg) { $('status').textContent = msg; return; }
  const vsCpu = cfg.modo === 'cpu';
  $('status').textContent = vsCpu ? (turnoActual === HUM ? 'Te toca (X)' : 'Piensa el móvil…') : 'Turno de ' + turnoActual;
}
function colocar(i) {
  const s = turnoActual;
  if (cfg.infinito) { const q = colas[s]; if (q.length === 3) tablero[q.shift()] = null; q.push(i); }
  tablero[i] = s;
  // primero se comprueba si ha terminado; solo después cambia el turno
  const g = ganador(tablero);
  if (g) {
    juegoActivo = false; cfg.marcador[g.s]++; save(); pintar(g.l);
    estado(cfg.modo === 'cpu' ? (g.s === HUM ? '¡Has ganado! 🎉' : 'Gana el móvil') : '¡Gana ' + g.s + '! 🎉');
    return;
  }
  if (!cfg.infinito && !tablero.includes(null)) { juegoActivo = false; cfg.marcador.empates++; save(); pintar(); estado('Empate'); return; }
  turnoActual = s === 'X' ? 'O' : 'X';
  pintar(); estado(); turnoCPU();
}
function jugarHumano(i) {
  if (!juegoActivo || bloqueoCPU || tablero[i] !== null) return; // filtro de seguridad
  if (cfg.modo === 'cpu' && turnoActual !== HUM) return;
  colocar(i);
}
function turnoCPU() {
  if (cfg.modo !== 'cpu' || !juegoActivo || turnoActual !== CPU) return;
  bloqueoCPU = true;
  cpuTimer = setTimeout(() => { const i = elegirCPU(); bloqueoCPU = false; if (juegoActivo && i != null) colocar(i); }, 450);
}

/* ---------- inteligencia del móvil ---------- */
// simula la jugada i del símbolo s (teniendo en cuenta el modo infinito)
function simular(t, q, i, s) {
  const nt = t.slice(), nq = { X: q.X.slice(), O: q.O.slice() };
  if (cfg.infinito) { if (nq[s].length === 3) nt[nq[s].shift()] = null; nq[s].push(i); }
  nt[i] = s; return [nt, nq];
}
function ganaCon(s) { for (const i of libres(tablero)) { const [nt] = simular(tablero, colas, i, s); const g = ganador(nt); if (g && g.s === s) return i; } return null; }
function minimax(t, q, s, prof, maxProf, a, b) {
  const g = ganador(t);
  if (g) return g.s === CPU ? 10 - prof : prof - 10;
  const L = libres(t);
  if (!L.length || prof >= maxProf) return 0;
  if (s === CPU) {
    let best = -Infinity;
    for (const i of L) { const [nt, nq] = simular(t, q, i, s); best = Math.max(best, minimax(nt, nq, HUM, prof + 1, maxProf, a, b)); a = Math.max(a, best); if (b <= a) break; }
    return best;
  }
  let best = Infinity;
  for (const i of L) { const [nt, nq] = simular(t, q, i, s); best = Math.min(best, minimax(nt, nq, CPU, prof + 1, maxProf, a, b)); b = Math.min(b, best); if (b <= a) break; }
  return best;
}
function elegirCPU() {
  const L = libres(tablero); if (!L.length) return null;
  const azar = () => L[Math.floor(Math.random() * L.length)];
  if (cfg.nivel === 'facil') return azar();
  if (cfg.nivel === 'medio') { const w = ganaCon(CPU); if (w != null) return w; const blq = ganaCon(HUM); if (blq != null) return blq; return azar(); }
  // imposible: minimax (en modo infinito el juego no acaba, así que se mira 7 jugadas por delante)
  const maxProf = cfg.infinito ? 7 : 9;
  let best = -Infinity, picks = [];
  for (const i of L) {
    const [nt, nq] = simular(tablero, colas, i, CPU);
    const v = minimax(nt, nq, HUM, 1, maxProf, -Infinity, Infinity);
    if (v > best) { best = v; picks = [i]; } else if (v === best) picks.push(i);
  }
  return picks[Math.floor(Math.random() * picks.length)];
}

/* ---------- controles ---------- */
function syncControls() {
  document.querySelectorAll('#modeSeg button').forEach(b => b.classList.toggle('on', b.dataset.m === cfg.modo));
  document.querySelectorAll('#levelSeg button').forEach(b => b.classList.toggle('on', b.dataset.l === cfg.nivel));
  $('levelBox').style.display = cfg.modo === 'cpu' ? '' : 'none';
  $('infinite').checked = cfg.infinito;
}
$('modeSeg').onclick = e => { const b = e.target.closest('button'); if (!b) return; cfg.modo = b.dataset.m; cfg.marcador = { X: 0, O: 0, empates: 0 }; save(); syncControls(); nuevaRonda(); };
$('levelSeg').onclick = e => { const b = e.target.closest('button'); if (!b) return; cfg.nivel = b.dataset.l; save(); syncControls(); nuevaRonda(); };
$('infinite').onchange = () => { cfg.infinito = $('infinite').checked; save(); nuevaRonda(); };
$('newRound').onclick = nuevaRonda;
$('resetScore').onclick = () => { cfg.marcador = { X: 0, O: 0, empates: 0 }; save(); nuevaRonda(); };
syncControls(); nuevaRonda();
</script>
</body>
</html>
